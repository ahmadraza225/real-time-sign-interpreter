<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Real-Time Sign Language Interpreter: translate American Sign Language gestures into text and speech in your browser using MediaPipe Hands and a deep-learning backend."
    />
    <!-- Monospace "terminal" typefaces for the hacker-console aesthetic.
         Falls back to system monospace fonts when offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <!--
      %PUBLIC_URL% is replaced by Create React App with the public folder URL.
      It is empty during development and set to the homepage path in a build.
    -->
    <title>SIGN_INTERPRETER :: ASL&rarr;TEXT</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this application.</noscript>
    <!-- React mounts the entire single-page application into this root element. -->
    <div id="root"></div>
  </body>
</html>
